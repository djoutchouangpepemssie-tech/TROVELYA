# Interdits à la vente (cahier 8.17, plan P2 Q33, Q34), lus par la modération à la publication.
#
# Principe : un refus est définitif (`removed`, recours seul). `refuse` ne contient donc que
# des expressions qui désignent sans doute possible la vente de l'objet (« bouteille de
# whisky », « fusil à pompe ») ; un mot seul, souvent innocent (« cognac » est une couleur,
# « Revolver » un album), va dans `review` ou nulle part.
#
# - `refuse` : l'annonce est refusée avec le motif (`label`).
# - `review` : l'annonce part en revue humaine sans être mise en ligne.
# - `unless` (en bas, commun à tous les motifs) : un mot qui change l'objet (« étui »,
#   « vide », « couleur », « livre », « chocolat »…) ailleurs dans le texte fait d'un refus
#   une mise en revue.
# - `except` (en bas) : expressions innocentes retirées du texte avant la recherche.
#
# Écriture des termes : minuscules sans accents, une apostrophe ou un tiret vaut une espace ;
# mots entiers ; `*` en fin de mot accepte toute fin (« munition* ») ; `(a|b c)` : l'une des
# expressions ; `~` : un mot quelconque ; `#` : un nombre ; `?` après un mot ou un groupe : facultatif
# (« defense d? elephant »). Les chiffres et
# symboles sosies (« r0lex », « vodk@ ») et les lettres espacées (« g l o c k ») sont lus
# comme des mots. Ce filtre est un premier filet : la revue humaine et la modération des
# images (T05b2) prennent le relais. Modifier ce fichier passe par une PR relue.

