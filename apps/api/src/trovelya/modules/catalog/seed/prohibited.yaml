# Interdits à la vente (cahier 8.17, plan P2 Q33, Q34), lus par la modération à la publication.
#
# - `refuse` : termes sans ambiguïté, l'annonce est refusée avec le motif (`label`).
# - `review` : termes ambigus, l'annonce part en revue humaine sans être mise en ligne.
# - `unless` : mots qui changent l'objet (« peluche chiot », « fusil jouet ») : un refus
#   devient une mise en revue.
# - `except` (en bas) : expressions innocentes retirées du texte avant la recherche
#   (« pistolet à colle », « cave à vin »).
#
# Les termes s'écrivent en minuscules, sans accents ; une apostrophe ou un tiret vaut une
# espace. Un terme correspond à des mots entiers ; `*` à la fin accepte toute fin de mot
# (« munition* » : munition, munitions). Les chiffres sosies des lettres (« r0lex ») sont lus
# comme des lettres. Modifier ce fichier passe par une PR (relue) ; l'édition par le staff
# viendra avec le back-office.

reasons:
