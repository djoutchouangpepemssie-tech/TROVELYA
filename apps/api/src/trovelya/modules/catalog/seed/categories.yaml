# Graine du catalogue TROVÉLYA (P2-T01) — PROPOSITION À VALIDER PAR ARCEL.
#
# Source de vérité de l'arbre des catégories et de leurs attributs (cahier 7.5 et 8.19).
# Rejouable sans perte : chaque catégorie est identifiée par sa `key`, jamais par son nom ni
# par sa place. Renommer = changer `fr` ; déplacer = changer de parent en gardant la `key`
# (le chemin ltree est recalculé, les annonces gardent leur catégorie). Une clé n'est jamais
# réutilisée ; une catégorie retirée passe `active: false` (jamais supprimée).
#
# Notation
# - Clés en snake_case ; la clé d'une catégorie reprend celle de son parent
#   (`mode.femme.robes`) et sert aussi de chemin ltree.
# - Les 16 univers (racines) reprennent exactement les clés de P1 (E11) :
#   préférences d'intérêts déjà enregistrées.
# - Héritage : `vertical`, `model`, `shipping`, `max_photos`, `brand`, `restricted`,
#   `conditions` et `attributes` s'appliquent à toute la descendance, sauf redéfinition.
#   Les attributs d'un nœud s'ajoutent à ceux de ses parents (`attributes_replace: true`
#   pour repartir de zéro).
# - Une annonce se publie uniquement dans une feuille (catégorie sans enfant).
# - Attributs : `clé` = facultatif et filtrable ; `clé!` = obligatoire et filtrable ;
#   `clé~` = facultatif et non filtrable.
# - `brand` : required | optional | none (champ « Marque » de l'annonce, table `brands`).
# - `conditions` : états autorisés (`item_condition`) ; absent = tous.
# - `model` : protected_purchase | contact | mixed ; `shipping` : envoi autorisé.
# - Verticales (immobilier, véhicules, services) : arbre jusqu'au niveau 3, masqué par le
#   drapeau `verticals` ; leurs attributs spécialisés arrivent en P9 (8.20 à 8.22).
# - Correspondance avec les tailles de l'accueil (P1) : préférence `top` ↔ attribut
#   `clothing_size` (hauts) ; préférence `shoe_eu` ↔ attribut `shoe_eu`.

