[project]
name = "trovelya-api"
version = "0.0.0"
description = "TROVÉLYA API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "uvicorn[standard]==0.54.0",
    "structlog==26.1.0",
    "redis==5.3.1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.32.0",
    "uuid-utils==1.1.0",
    "alembic==1.20.1",
    "arq==0.28.0",
    "sentry-sdk[fastapi]==2.73.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
    "opentelemetry-instrumentation-sqlalchemy==0.66b1",
    "opentelemetry-instrumentation-redis==0.66b1",
    "httpx==0.28.1",
    "cryptography==50.0.2",
    "aiosmtplib==5.1.3",
    "pyjwt==2.15.1",
    "webauthn==3.0.1",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.2",
    "pyright==1.1.414",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers==4.15.0",
    "hypothesis==6.170.8",
    "import-linter==2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trovelya"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "S", "BLE", "C4", "DTZ", "T20", "RET", "SIM", "PTH", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
