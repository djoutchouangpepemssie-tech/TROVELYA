# Alembic: one linear history, migrations stored in the module that owns the tables (ADR, E6).
[alembic]
script_location = %(here)s/src/trovelya/core/migrations
version_locations = %(here)s/src/trovelya/core/migrations/versions %(here)s/src/trovelya/modules/ledger/migrations/versions %(here)s/src/trovelya/modules/identity/migrations/versions %(here)s/src/trovelya/modules/catalog/migrations/versions %(here)s/src/trovelya/modules/media/migrations/versions %(here)s/src/trovelya/modules/circumvention/migrations/versions %(here)s/src/trovelya/modules/ai/migrations/versions
path_separator = space
prepend_sys_path = src
# sqlalchemy.url is read from DATABASE_URL by env.py unless set programmatically (tests).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
