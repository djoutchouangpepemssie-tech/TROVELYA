version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      js-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      py-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/apps/api, /infra/postgres]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
