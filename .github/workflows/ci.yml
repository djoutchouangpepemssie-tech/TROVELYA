name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  js:
    name: js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm turbo run lint typecheck test build --filter=!@trovelya/api

  e2e-web:
    name: e2e-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@trovelya/web
      - run: pnpm --filter @trovelya/web exec playwright install --with-deps chromium
      - run: pnpm --filter @trovelya/web test:e2e

  py:
    name: py
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build TROVÉLYA PostgreSQL image (integration tests run against it)
        run: docker build -t trovelya/postgres:17 ../../infra/postgres
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run lint-imports
      - name: Tests with global coverage (P0 gate, 85 %)
        run: uv run pytest --cov=trovelya --cov-report=term --cov-fail-under=85
      - name: Money must stay fully covered (P0 gate G7)
        run: uv run pytest -q tests/unit/test_money.py --cov=trovelya.shared.money --cov-fail-under=100

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project apps/api
      - name: Regenerate the OpenAPI contract and the TypeScript client
        run: pnpm api:generate
      - name: Fail if the committed contract or client is out of date
        run: git diff --exit-code docs/api packages/api-client/src/schema.d.ts

  postgres-image:
    name: postgres-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build TROVÉLYA PostgreSQL image
        run: docker build -t trovelya/postgres:17 infra/postgres
      - name: Start a fresh database
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=ci trovelya/postgres:17
          # The init phase runs a socket-only server; TCP opens only once initialisation is complete.
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U postgres && break; sleep 2; done
      - name: Create every required extension
        run: |
          docker cp infra/postgres/check_extensions.sql pg:/check_extensions.sql
          docker exec pg psql -U postgres -v ON_ERROR_STOP=1 -f /check_extensions.sql

  api-image:
    name: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the images Railway deploys
        run: |
          docker build -t trovelya/postgres:17 infra/postgres
          docker build -t trovelya/api apps/api
      - name: Migrate, start, and probe the API like Railway does
        run: |
          docker network create smoke
          docker run -d --name pg --network smoke -e POSTGRES_USER=trovelya -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=trovelya trovelya/postgres:17
          docker run -d --name redis --network smoke redis:8.2-alpine
          for i in $(seq 1 60); do docker exec pg pg_isready -h 127.0.0.1 -U trovelya && break; sleep 2; done
          cat > api.env <<'ENV'
          ENV=staging
          DATABASE_URL=postgresql://trovelya:ci@pg:5432/trovelya
          REDIS_URL=redis://redis:6379/0
          SECRET_KEY=ci-only-secret-key-ci-only-secret-key-ci-only-secret-key-0123456789
          WEB_ORIGIN=https://example.vercel.app
          ADMIN_ORIGIN=https://example.vercel.app
          ENV
          docker run --rm --network smoke --env-file api.env trovelya/api alembic upgrade head
          docker run -d --name api --network smoke --env-file api.env -p 8000:8000 trovelya/api
          for i in $(seq 1 30); do curl -fsS localhost:8000/ready && break; sleep 2; done
          curl -fsS localhost:8000/health
          curl -fsS localhost:8000/ready

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the full history
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # uvx tools only: nothing to cache, and v7 fails on an empty cache
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          # No pnpm cache: this job never installs, and v7 fails when saving an empty cache.
      - name: Semgrep (public rulesets + .semgrep.yml, blocking on ERROR)
        env:
          SEMGREP_SEND_METRICS: "off"
        run: >-
          uvx semgrep==1.182.1 scan --error --severity ERROR
          --config p/python --config p/typescript --config p/secrets --config p/owasp-top-ten
          --config .semgrep.yml
          --exclude .claude
      - name: Gitleaks (full git history)
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          ./gitleaks git --config .gitleaks.toml --redact --no-banner .
      - name: pip-audit (Python dependencies, dev included)
        working-directory: apps/api
        run: |
          uv export --locked --all-groups --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==2.10.1 --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"
      - name: pnpm audit (high and critical)
        run: pnpm audit --audit-level high

  sbom:
    name: sbom
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: CycloneDX SBOM of the repository (pnpm-lock.yaml and uv.lock)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom-${{ github.sha }}.cdx.json
          upload-release-assets: false
